<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Jobs SG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:wght@700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#12213a;--mute:#56647c;--line:#12213a24;--btn:#1f4fd8;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#18243b;--ink:#eaf0fb;--mute:#9fb0cc;--line:#ffffff28;--btn:#5b86ff;--btnink:#0b1220}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#18243b;--ink:#eaf0fb;--mute:#9fb0cc;--line:#ffffff28;--btn:#5b86ff;--btnink:#0b1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;margin:0;line-height:1.05}
h1{font-size:42px}h2{font-size:30px}h3{font-size:25px}
p{margin:4px 0}
.sub{color:var(--mute);margin:4px 0 12px}
.note{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--mute);margin:10px 0}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;min-height:46px;cursor:pointer}
.tab.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px;min-height:40px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-weight:700;margin:10px 0}
input,select{font:inherit;display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
input[type=radio]{display:inline-block;width:20px;min-height:20px;margin:0}
fieldset{border:2px solid var(--line);border-radius:12px;margin:12px 0;padding:8px 12px 12px}
legend{font-weight:700;padding:0 6px}
.rad{display:flex;gap:10px;align-items:center;font-weight:500;margin:6px 0}
.two{display:flex;gap:8px;margin-top:8px}
.two input{flex:2;margin:0}.two select{flex:1;margin:0}
.job{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.tag{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--c);color:#fff;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:21px;padding:12px 8px;text-align:center;flex:none}
.bd{padding:12px 14px;flex:1;min-width:0}
.where,.by{color:var(--mute)}
.pay{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:700;margin:6px 0}
.pay.hid{font-family:Barlow,system-ui,sans-serif;font-size:16px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;min-height:44px;padding:8px 18px;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:20px;width:100%;margin-top:6px}
.mini{display:flex;gap:16px;margin-top:4px}
.link{font:inherit;font-size:15px;background:none;border:0;color:var(--mute);text-decoration:underline;padding:8px 0;cursor:pointer}
.ok{background:#16a34a26;border:2px solid #16a34a;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:700}
.err{color:#e11d48;font-weight:700;min-height:1.4em}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.btn.warn{background:#e11d48;color:#fff}
.cf{font-size:15px;color:var(--mute);margin:4px 0}
.nocall{font-weight:700;color:#e11d48;border:2px solid #e11d48;border-radius:10px;padding:6px 10px;margin:8px 0}
.ask{background:#e11d4818;border:2px solid #e11d48;border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700}
.tab:focus-visible,.chip:focus-visible,.btn:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}

.stamp{color:var(--mute);font-size:15px;margin:8px 0}</style>
</head>
<body>
<div id="app"><h1>Security Jobs SG</h1><p class="sub">Contact the person listed on each vacancy to apply.</p><div id="top"></div><div id="list"><p class="empty">Loading vacancies...</p></div></div>
<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS78asH2fBz4e5v5TFr2UzL32-N0-utt_yhzn0ZSLpszi3V0vbfma1Q_VNXb3en9Xr2DAnkoUiDoBg-/pub?gid=887468801&single=true&output=csv";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TY={full:["Full-time","#1f4fd8"],relief:["Relief","#0b7d6e"],adhoc:["Ad hoc","#b45309"],event:["Event","#7c3aed"]};
const AR=["North","South","East","West","Central","Islandwide"];
const SAMPLE=[["Women Security Officer (WSO) x1", "51 Cuppage Road, S229469", "Central", "Day shift, 8am to 8pm"], ["Senior Security Officer (SSO) x1", "Eclipse, 1 Fusionopolis View, S138577", "West", "Day shift, 8am to 8pm"], ["Security Officer (SO) x1", "Eclipse, 1 Fusionopolis View, S138577", "West", "Day shift, 8am to 8pm"], ["Security Officer (SO) x1", "Eclipse, 1 Fusionopolis View, S138577", "West", "Night shift, 8pm to 8am"], ["Security Officer (SO) x1", "DODID Data Centre, 71 Tagore Lane, S787496", "North", "Day shift, 8am to 8pm"], ["Security Officer (SO) x1", "3M Tuas Plant, 2 Tuas Link 4, S637321", "West", "Day shift, 8am to 8pm"], ["Security Officer (SO) x1", "Avenue South Residence, Silat Avenue", "South", "Night shift, 8pm to 8am"], ["Security Supervisor (SS) x1", "Leonie Gardens, 23 Leonie Hill, S239224", "Central", "Day shift, 8am to 8pm"], ["Senior Security Officer (SSO) x1", "Leonie Gardens, 23 Leonie Hill, S239224", "Central", "Day shift, 8am to 8pm"]].map(([title,site,area,shift])=>({title,site,area,shift,type:"full",date:"",showPay:false,pay:"",unit:"per month",showBy:true,by:"Feroz, Operations Executive",phone:"81105153",wa:true,email:""}));
const today=new Date().toLocaleDateString("en-CA");
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"});
let jobs=[],ft="all",fa="all",note="",stamp="";
function parseCSV(t){const rows=[];let r=[],c="",q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch==='"')q=true;
else if(ch===","){r.push(c);c=""}
else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
else c+=ch}
if(c!==""||r.length){r.push(c);rows.push(r)}
return rows}
const yes=v=>/^(y|yes|true|1)$/i.test(String(v||"").trim());
const typeOf=v=>{v=String(v||"").toLowerCase().replace(/[^a-z]/g,"");return v.startsWith("relief")?"relief":v.startsWith("adhoc")?"adhoc":v.startsWith("event")?"event":"full"};
function toDate(v){v=String(v||"").trim();if(!v)return"";let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);
if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return""}
function toJobs(rows){if(!rows.length)return[];
const h=rows[0].map(x=>String(x).trim().toLowerCase().replace(/[^a-z]+/g,"_").replace(/^_|_$/g,""));
return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=String(r[i]||"").trim());return o})
.filter(o=>o.title&&!/^(closed|filled)$/i.test(o.status||""))
.map(o=>{const amt=parseFloat(String(o.salary).replace(/[^0-9.]/g,""));
return {title:o.title,type:typeOf(o.type),area:AR.find(a=>a.toLowerCase()===String(o.area).toLowerCase())||o.area||"Islandwide",site:o.site,date:toDate(o.date),shift:o.shift,showPay:yes(o.show_salary)&&amt>0,pay:amt>0?String(amt):"",unit:o.salary_unit||"per month",showBy:yes(o.show_contact)&&!!o.contact,by:o.contact,phone:o.phone,wa:yes(o.whatsapp_only),email:o.email}})}
function card(p){const [lb,c]=TY[p.type]||TY.full,d=(p.phone||"").replace(/\D/g,""),n=d.length===8?"65"+d:d,
wm=encodeURIComponent("Hi, I would like to apply for this vacancy:\n"+p.title+"\n"+[p.site,p.area].filter(Boolean).join(", ")+(p.shift?"\n"+p.shift:"")+"\n\nMy name: ");
return `<article class="job" style="--c:${c}"><div class="tag">${lb}</div><div class="bd"><h3>${esc(p.title)}</h3><p class="where">${esc([p.site,p.area].filter(Boolean).join(", "))}</p><p><b>${p.date?esc(fmt(p.date)):"Ongoing"}</b>${p.shift?", "+esc(p.shift):""}</p><p class="pay${p.showPay?"":" hid"}">${p.showPay?"$"+Number(p.pay).toLocaleString("en-SG")+" "+esc(p.unit):"Salary: to be disclosed"}</p><p class="by">${p.showBy?"Contact person: "+esc(p.by):"Contact person hidden"}</p>${n&&p.wa?'<p class="nocall">DO NOT CALL. WhatsApp text only.</p>':""}<div class="acts">${n&&!p.wa?`<a class="btn" href="tel:+${n}">Call</a>`:""}${n?`<a class="btn${p.wa?"":" alt"}" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${wm}">${p.wa?"WhatsApp text":"WhatsApp"}</a>`:""}${p.email?`<a class="btn alt" href="mailto:${esc(p.email)}?subject=${encodeURIComponent("Application: "+p.title+", "+p.site)}">Email</a>`:""}</div></div></article>`}
function render(){const L=jobs.filter(p=>(!p.date||p.date>=today)&&(ft==="all"||p.type===ft)&&(fa==="all"||p.area===fa));
$("top").innerHTML=(note?`<div class="note">${esc(note)}</div>`:"")+`<div class="chips">${[["all","All"]].concat(Object.entries(TY).map(([k,v])=>[k,v[0]])).map(([k,l])=>`<button class="chip${ft===k?" on":""}" data-ft="${k}">${l}</button>`).join("")}</div><select id="fa" aria-label="Area"><option value="all">All areas</option>${AR.map(a=>`<option${fa===a?" selected":""}>${a}</option>`).join("")}</select><div style="height:12px"></div>`;
$("list").innerHTML=(L.length?L.map(card).join(""):'<p class="empty">No vacancies match. Try another type or area.</p>')+(stamp?`<p class="stamp">Updated ${esc(stamp)}. <button class="link" id="rf">Refresh</button></p>`:"");
const rf=$("rf");if(rf)rf.onclick=()=>load(false)}
async function load(silent){const el=$("list");
if(SHEET_URL.indexOf("PASTE_")>=0){jobs=SAMPLE;note="Setup not finished, so these are sample vacancies.";render();return}
if(!silent)el.innerHTML='<p class="empty">Loading vacancies...</p>';
try{const r=await fetch(SHEET_URL,{cache:"no-store"});if(!r.ok)throw new Error("http");
const t=await r.text();if(/^\s*</.test(t))throw new Error("not csv");
jobs=toJobs(parseCSV(t));note="";stamp=new Date().toLocaleTimeString("en-SG",{hour:"numeric",minute:"2-digit"});render()}
catch(e){if(silent)return;el.innerHTML='<p class="empty">Could not load the vacancies. Check your connection and try again.</p><p class="empty"><button class="btn" id="retry">Try again</button></p>';$("retry").onclick=()=>load(false)}}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-ft]");if(t){ft=t.dataset.ft;render()}});
document.addEventListener("change",e=>{if(e.target.id==="fa"){fa=e.target.value;render()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&SHEET_URL.indexOf("PASTE_")<0)load(true)});
load(false);
</script>
</body>
</html>
